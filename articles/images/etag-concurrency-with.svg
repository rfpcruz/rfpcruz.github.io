<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Concurrent updates with e-Tags</title>
<desc>Client 1 and Client 2 both send an If-Match header with the e-Tag they read. The API applies the first matching write and rejects the second with a 412 Precondition Failed, since its e-Tag is now stale.</desc>

<rect x="0" y="0" width="680" height="300" rx="8" fill="#15171e" stroke="#262932" stroke-width="1"/>

<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#565b66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="60" width="150" height="56" rx="6" fill="#1f2229" stroke="#454952" stroke-width="1"/>
<text x="115" y="84" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#e8e9ec">Client 1</text>
<text x="115" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#565b66">If-Match: "v1"</text>

<rect x="40" y="190" width="150" height="56" rx="6" fill="#1f2229" stroke="#454952" stroke-width="1"/>
<text x="115" y="214" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#e8e9ec">Client 2</text>
<text x="115" y="232" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#565b66">If-Match: "v1"</text>

<rect x="310" y="120" width="130" height="60" rx="6" fill="#5fd1c9" stroke="none"/>
<text x="375" y="155" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#0b1a18">HTTP API</text>

<line x1="190" y1="88" x2="308" y2="140" stroke="#565b66" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="190" y1="218" x2="308" y2="165" stroke="#565b66" stroke-width="1.5" marker-end="url(#arrow2)"/>

<path d="M440 140 C500 130, 540 130, 580 150" fill="none" stroke="#4caf7d" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="510" y="122" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#4caf7d">200 OK, new e-Tag "v2"</text>

<line x1="440" y1="168" x2="470" y2="196" stroke="#c0392b" stroke-width="2"/>
<line x1="470" y1="168" x2="440" y2="196" stroke="#c0392b" stroke-width="2"/>
<text x="510" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#c0392b">412 Precondition Failed</text>

<ellipse cx="620" cy="150" rx="34" ry="14" fill="none" stroke="#e8e9ec" stroke-width="1.5"/>
<path d="M586 150 L586 210 A34 14 0 0 0 654 210 L654 150" fill="none" stroke="#e8e9ec" stroke-width="1.5"/>
<line x1="586" y1="150" x2="586" y2="210" stroke="#e8e9ec" stroke-width="1.5"/>
<text x="620" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#565b66">DB</text>

</svg>
