<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="transparent"/>

  <!-- connecting spine -->
  <line x1="130" y1="170" x2="670" y2="170" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- LLM -->
  <g>
    <rect x="40" y="110" width="160" height="120" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="150" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">LLM</text>
    <text x="120" y="170" text-anchor="middle" fill="#e6edf3" font-size="12">The Brain</text>
    <text x="120" y="196" text-anchor="middle" fill="#8b949e" font-size="10">static intelligence</text>
    <text x="120" y="212" text-anchor="middle" fill="#8b949e" font-size="10">frozen weights</text>
  </g>

  <!-- RAG -->
  <g>
    <rect x="240" y="110" width="160" height="120" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="320" y="150" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">RAG</text>
    <text x="320" y="170" text-anchor="middle" fill="#e6edf3" font-size="12">The Memory</text>
    <text x="320" y="196" text-anchor="middle" fill="#8b949e" font-size="10">injected context</text>
    <text x="320" y="212" text-anchor="middle" fill="#8b949e" font-size="10">vector retrieval</text>
  </g>

  <!-- Agents -->
  <g>
    <rect x="440" y="110" width="160" height="120" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="520" y="150" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">AGENTS</text>
    <text x="520" y="170" text-anchor="middle" fill="#e6edf3" font-size="12">The Hands</text>
    <text x="520" y="196" text-anchor="middle" fill="#8b949e" font-size="10">autonomous action</text>
    <text x="520" y="212" text-anchor="middle" fill="#8b949e" font-size="10">ReAct loop</text>
  </g>

  <!-- MCP -->
  <g>
    <rect x="600" y="110" width="160" height="120" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5" transform="translate(40,0)"/>
    <text x="720" y="150" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">MCP</text>
    <text x="720" y="170" text-anchor="middle" fill="#e6edf3" font-size="12">Nervous System</text>
    <text x="720" y="196" text-anchor="middle" fill="#8b949e" font-size="10">standard protocol</text>
    <text x="720" y="212" text-anchor="middle" fill="#8b949e" font-size="10">secure connectivity</text>
  </g>

  <text x="400" y="40" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Anatomy of a Modern AI System</text>
  <text x="400" y="62" text-anchor="middle" fill="#8b949e" font-size="11">reasoning · context · action · communication</text>

  <text x="400" y="300" text-anchor="middle" fill="#8b949e" font-size="10">All four layers work together — none of them, alone, is "the AI system."</text>
</svg>
