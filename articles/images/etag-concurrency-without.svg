<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Concurrent updates without e-Tags</title>
<desc>Client 1 and Client 2 both send updates through an HTTP API to a database with no version check, so the second write silently overwrites the first.</desc>

<rect x="0" y="0" width="680" height="300" rx="8" fill="#15171e" stroke="#262932" stroke-width="1"/>

<defs>
  <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#565b66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="60" width="120" height="50" rx="6" fill="#1f2229" stroke="#454952" stroke-width="1"/>
<text x="100" y="90" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#e8e9ec">Client 1</text>

<rect x="40" y="190" width="120" height="50" rx="6" fill="#1f2229" stroke="#454952" stroke-width="1"/>
<text x="100" y="220" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#e8e9ec">Client 2</text>

<rect x="290" y="120" width="130" height="60" rx="6" fill="#5fd1c9" stroke="none"/>
<text x="355" y="155" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#0b1a18">HTTP API</text>

<line x1="160" y1="85" x2="288" y2="140" stroke="#565b66" stroke-width="1.5" marker-end="url(#arrow1)"/>
<line x1="160" y1="215" x2="288" y2="162" stroke="#565b66" stroke-width="1.5" marker-end="url(#arrow1)"/>

<path d="M420 140 C480 130, 520 130, 560 150" fill="none" stroke="#565b66" stroke-width="1.5" marker-end="url(#arrow1)"/>
<path d="M420 165 C480 175, 520 175, 560 155" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow1)"/>

<ellipse cx="600" cy="150" rx="34" ry="14" fill="none" stroke="#e8e9ec" stroke-width="1.5"/>
<path d="M566 150 L566 210 A34 14 0 0 0 634 210 L634 150" fill="none" stroke="#e8e9ec" stroke-width="1.5"/>
<line x1="566" y1="150" x2="566" y2="210" stroke="#e8e9ec" stroke-width="1.5"/>
<text x="600" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#565b66">DB</text>

<text x="490" y="118" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#c0392b">2nd write silently overwrites the 1st</text>

</svg>
