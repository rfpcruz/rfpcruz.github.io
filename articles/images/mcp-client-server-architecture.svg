<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="transparent"/>
  <text x="400" y="34" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">MCP: client-server architecture</text>

  <!-- LLM App / MCP client -->
  <rect x="300" y="70" width="200" height="70" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1.5"/>
  <text x="400" y="98" text-anchor="middle" fill="#f97316" font-size="12" font-weight="700">LLM Application</text>
  <text x="400" y="116" text-anchor="middle" fill="#8b949e" font-size="10">MCP client</text>
  <text x="400" y="130" text-anchor="middle" fill="#8b949e" font-size="9">JSON-RPC 2.0</text>

  <!-- servers -->
  <rect x="60" y="230" width="170" height="70" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="145" y="258" text-anchor="middle" fill="#e6edf3" font-size="11">MCP Server</text>
  <text x="145" y="276" text-anchor="middle" fill="#8b949e" font-size="9">database</text>

  <rect x="315" y="230" width="170" height="70" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="258" text-anchor="middle" fill="#e6edf3" font-size="11">MCP Server</text>
  <text x="400" y="276" text-anchor="middle" fill="#8b949e" font-size="9">GitHub repository</text>

  <rect x="570" y="230" width="170" height="70" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="655" y="258" text-anchor="middle" fill="#e6edf3" font-size="11">MCP Server</text>
  <text x="655" y="276" text-anchor="middle" fill="#8b949e" font-size="9">local files / logs</text>

  <!-- connectors -->
  <line x1="360" y1="140" x2="160" y2="228" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <line x1="400" y1="140" x2="400" y2="228" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow4)"/>
  <line x1="440" y1="140" x2="640" y2="228" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <text x="400" y="320" text-anchor="middle" fill="#8b949e" font-size="10">one standard protocol, replacing a bespoke connector per integration</text>
</svg>
