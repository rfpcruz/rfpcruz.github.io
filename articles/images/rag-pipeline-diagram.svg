<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="transparent"/>
  <text x="400" y="32" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">RAG pipeline</text>

  <!-- ingestion row -->
  <rect x="40" y="70" width="130" height="60" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="105" y="95" text-anchor="middle" fill="#e6edf3" font-size="11">Documents</text>
  <text x="105" y="112" text-anchor="middle" fill="#8b949e" font-size="9">PDFs, docs, DB rows</text>

  <line x1="170" y1="100" x2="215" y2="100" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="220" y="70" width="130" height="60" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="285" y="95" text-anchor="middle" fill="#e6edf3" font-size="11">Chunking +</text>
  <text x="285" y="110" text-anchor="middle" fill="#e6edf3" font-size="11">Embedding model</text>

  <line x1="350" y1="100" x2="395" y2="100" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="400" y="70" width="150" height="60" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="475" y="95" text-anchor="middle" fill="#e6edf3" font-size="11">Vector Database</text>
  <text x="475" y="112" text-anchor="middle" fill="#8b949e" font-size="9">pgvector · Chroma · Pinecone</text>

  <!-- query row -->
  <rect x="40" y="220" width="130" height="60" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="105" y="245" text-anchor="middle" fill="#e6edf3" font-size="11">User query</text>
  <text x="105" y="262" text-anchor="middle" fill="#8b949e" font-size="9">natural language</text>

  <line x1="170" y1="250" x2="215" y2="250" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="220" y="220" width="130" height="60" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="285" y="245" text-anchor="middle" fill="#e6edf3" font-size="11">Query vector</text>
  <text x="285" y="262" text-anchor="middle" fill="#8b949e" font-size="9">same embedding model</text>

  <!-- similarity search bridging both rows -->
  <line x1="285" y1="220" x2="475" y2="130" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="590" y="145" width="170" height="60" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1.5"/>
  <text x="675" y="170" text-anchor="middle" fill="#f97316" font-size="11">Similarity search</text>
  <text x="675" y="187" text-anchor="middle" fill="#8b949e" font-size="9">cosine distance</text>

  <line x1="550" y1="100" x2="595" y2="160" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="350" y1="250" x2="595" y2="185" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <line x1="675" y1="205" x2="675" y2="250" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="590" y="255" width="170" height="60" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="675" y="280" text-anchor="middle" fill="#e6edf3" font-size="11">Context + query</text>
  <text x="675" y="297" text-anchor="middle" fill="#8b949e" font-size="9">passed to the LLM</text>

  <text x="400" y="355" text-anchor="middle" fill="#8b949e" font-size="10">retrieve first, generate second — the answer is grounded before it's written</text>
</svg>
