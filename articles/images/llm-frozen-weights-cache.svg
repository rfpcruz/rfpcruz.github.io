<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <rect x="0" y="0" width="800" height="300" fill="transparent"/>

  <text x="400" y="34" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">LLM = frozen, read-only cache</text>

  <!-- timeline -->
  <line x1="80" y1="150" x2="720" y2="150" stroke="#30363d" stroke-width="2"/>

  <!-- training window -->
  <rect x="80" y="130" width="300" height="40" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="230" y="155" text-anchor="middle" fill="#38bdf8" font-size="11">training data</text>

  <!-- cutoff marker -->
  <line x1="380" y1="110" x2="380" y2="190" stroke="#f97316" stroke-width="2"/>
  <text x="380" y="100" text-anchor="middle" fill="#f97316" font-size="10">training cutoff</text>

  <!-- unknown zone -->
  <rect x="380" y="130" width="340" height="40" fill="#0d1117" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="550" y="155" text-anchor="middle" fill="#8b949e" font-size="11">unknown — zero awareness</text>

  <!-- now marker -->
  <line x1="700" y1="110" x2="700" y2="190" stroke="#e6edf3" stroke-width="2"/>
  <text x="700" y="100" text-anchor="middle" fill="#e6edf3" font-size="10">now</text>

  <text x="400" y="230" text-anchor="middle" fill="#8b949e" font-size="11">no live data · no DB access · no state · no actions</text>
  <text x="400" y="252" text-anchor="middle" fill="#8b949e" font-size="11">gaps get filled with plausible-sounding, unverified text — a hallucination</text>
</svg>
