<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="transparent"/>
  <text x="350" y="34" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">The ReAct loop</text>

  <!-- Thought (top) -->
  <circle cx="350" cy="110" r="60" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="350" y="105" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Thought</text>
  <text x="350" y="122" text-anchor="middle" fill="#8b949e" font-size="9">reason about the task</text>

  <!-- Action (right) -->
  <circle cx="520" cy="260" r="60" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="520" y="255" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Action</text>
  <text x="520" y="272" text-anchor="middle" fill="#8b949e" font-size="9">call an external tool</text>

  <!-- Observation (left) -->
  <circle cx="180" cy="260" r="60" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="180" y="255" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Observation</text>
  <text x="180" y="272" text-anchor="middle" fill="#8b949e" font-size="9">read the tool's result</text>

  <!-- loop arrows -->
  <path d="M 400 145 A 200 200 0 0 1 500 210" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <path d="M 470 300 A 200 200 0 0 1 230 300" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <path d="M 200 210 A 200 200 0 0 1 300 145" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- exit to final answer -->
  <line x1="350" y1="170" x2="350" y2="70" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="255" y="355" width="190" height="46" rx="6" fill="#0d1117" stroke="#f97316" stroke-width="1.5"/>
  <text x="350" y="383" text-anchor="middle" fill="#f97316" font-size="11">Final answer</text>
  <line x1="350" y1="320" x2="350" y2="352" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow3)"/>
</svg>
