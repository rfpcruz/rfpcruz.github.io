<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" role="img" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>MCP path vs. API path</title>
  <desc>Two parallel paths. The MCP path: an AI agent receives a task, the MCP server returns its tools, the agent selects a tool, and the MCP server translates the tools/call into a call to the underlying API. The API path: an app sends a request and a gateway validates and routes it. Both paths end at the same API / service.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="570" rx="10" fill="#0d1117"/>

  <!-- Lane headers -->
  <text x="40" y="34" font-size="13" font-weight="700" letter-spacing="1.5" fill="#a78bfa">MCP PATH</text>
  <text x="40" y="52" font-size="11" fill="#8b949e">the agent discovers, then calls</text>
  <text x="460" y="34" font-size="13" font-weight="700" letter-spacing="1.5" fill="#2dd4bf">API PATH</text>
  <text x="460" y="52" font-size="11" fill="#8b949e">the app calls directly</text>

  <!-- MCP path -->
  <g>
    <rect x="40" y="70" width="300" height="64" rx="8" fill="#161b22" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="60" y="97" font-size="14" font-weight="700" fill="#e6edf3">1  AI agent</text>
    <text x="60" y="118" font-size="12" fill="#8b949e">receives a task</text>
  </g>
  <line x1="190" y1="134" x2="190" y2="160" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>

  <g>
    <rect x="40" y="160" width="300" height="64" rx="8" fill="#161b22" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="60" y="187" font-size="14" font-weight="700" fill="#e6edf3">2  MCP server</text>
    <text x="60" y="208" font-size="12" fill="#8b949e">tools/list returns tools + schemas</text>
  </g>
  <line x1="190" y1="224" x2="190" y2="250" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>

  <g>
    <rect x="40" y="250" width="300" height="64" rx="8" fill="#161b22" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="60" y="277" font-size="14" font-weight="700" fill="#e6edf3">3  AI agent</text>
    <text x="60" y="298" font-size="12" fill="#8b949e">decides which tool fits the task</text>
  </g>
  <line x1="190" y1="314" x2="190" y2="340" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>

  <g>
    <rect x="40" y="340" width="300" height="64" rx="8" fill="#161b22" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="60" y="367" font-size="14" font-weight="700" fill="#e6edf3">4  MCP server</text>
    <text x="60" y="388" font-size="12" fill="#8b949e">translates tools/call into an API call</text>
  </g>

  <!-- API path -->
  <g>
    <rect x="460" y="70" width="300" height="64" rx="8" fill="#161b22" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="480" y="97" font-size="14" font-weight="700" fill="#e6edf3">1  Your app</text>
    <text x="480" y="118" font-size="12" fill="#8b949e">sends a request</text>
  </g>
  <line x1="610" y1="134" x2="610" y2="160" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>

  <g>
    <rect x="460" y="160" width="300" height="64" rx="8" fill="#161b22" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="480" y="187" font-size="14" font-weight="700" fill="#e6edf3">2  Gateway</text>
    <text x="480" y="208" font-size="12" fill="#8b949e">validates the API key, routes</text>
  </g>

  <!-- Converging connectors -->
  <path d="M190 404 L190 427 L350 427 L350 450" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M610 224 L610 427 L450 427 L450 450" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Shared service -->
  <g>
    <rect x="300" y="450" width="200" height="64" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/>
    <text x="400" y="477" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">API / service</text>
    <text x="400" y="498" font-size="12" fill="#8b949e" text-anchor="middle">executes the request</text>
  </g>

  <text x="400" y="548" font-size="12" fill="#8b949e" text-anchor="middle">Both paths end up calling the same underlying API</text>
</svg>
