<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Os Meus Terrenos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.0/togeojson.js"></script>

<style>
  :root{
    --pine:#16221C;
    --pine-panel:#1F2E26;
    --pine-panel-hover:#26362C;
    --olive:#7FA65C;
    --gold:#C9A84C;
    --parchment:#EDE7D9;
    --parchment-dim:#B9C0B4;
    --line:#33443A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--pine);font-family:'Inter',sans-serif;color:var(--parchment);}

  #app{display:flex;height:100vh;width:100vw;overflow:hidden;}

  /* ---- Sidebar ---- */
  #sidebar{
    width:340px;flex-shrink:0;background:var(--pine-panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    z-index:1000;
  }
  #sidebar header{
    padding:22px 22px 16px;border-bottom:1px solid var(--line);
  }
  #sidebar h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;margin:0 0 4px;
    letter-spacing:0.01em;
  }
  #sidebar .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--olive);margin:0 0 10px;
  }
  #sidebar .sub{font-size:0.85rem;color:var(--parchment-dim);margin:0;}

  #lista{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1;}
  #lista li{
    padding:14px 14px;margin-bottom:6px;border-radius:6px;cursor:pointer;
    border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  #lista li:hover, #lista li.ativo{
    background:var(--pine-panel-hover);
    border-color:var(--line);
  }
  #lista li.ativo{border-left:3px solid var(--gold);}
  #lista .nome{font-weight:600;font-size:0.95rem;margin-bottom:3px;}
  #lista .desc{font-size:0.8rem;color:var(--parchment-dim);}
  #lista .coords{
    font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--olive);
    margin-top:6px;letter-spacing:0.02em;
  }

  /* ---- Map ---- */
  #map{flex:1;background:var(--pine);}

  /* Leaflet popup restyle -- field-tag look */
  .leaflet-popup-content-wrapper{
    background:var(--pine-panel);color:var(--parchment);
    border:1px dashed var(--olive);border-radius:4px;
  }
  .leaflet-popup-tip{background:var(--pine-panel);}
  .leaflet-popup-content{margin:16px 18px;min-width:220px;}
  .popup-eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;
    text-transform:uppercase;color:var(--olive);margin-bottom:6px;
  }
  .popup-nome{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;margin:0 0 4px;}
  .popup-desc{font-size:0.82rem;color:var(--parchment-dim);margin:0 0 10px;}
  .popup-coords{
    font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--parchment-dim);
    margin-bottom:12px;
  }
  .popup-botoes{display:flex;gap:6px;flex-wrap:wrap;}
  .popup-botoes a{
    font-family:'Inter',sans-serif;font-size:0.75rem;font-weight:600;text-decoration:none;
    color:var(--pine);background:var(--gold);padding:7px 10px;border-radius:4px;
    transition:filter .15s ease;
  }
  .popup-botoes a:hover{filter:brightness(1.1);}
  .popup-botoes a.waze{background:var(--olive);color:var(--pine);}
  .popup-botoes a.apple{background:transparent;color:var(--parchment);border:1px solid var(--line);}

  /* Mobile */
  @media (max-width:720px){
    #app{flex-direction:column;}
    #sidebar{width:100%;height:38vh;border-right:none;border-bottom:1px solid var(--line);}
    #map{flex:1;}
  }

  /* Focus visibility */
  a:focus-visible, li:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  #loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--parchment-dim);font-family:'JetBrains Mono',monospace;font-size:0.8rem;
    letter-spacing:0.08em;z-index:2000;background:var(--pine);
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <header>
      <p class="eyebrow">Cadastro de Campo</p>
      <h1>Os Meus Terrenos</h1>
      <p class="sub">Toca num terreno para ver a ficha e abrir a navegação.</p>
    </header>
    <ul id="lista"></ul>
  </aside>
  <main id="map">
    <div id="loading">A carregar terrenos…</div>
  </main>
</div>

<script>
const map = L.map('map', {zoomControl:false}).setView([40.351, -8.605], 15);
L.control.zoom({position:'bottomright'}).addTo(map);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics',
  maxZoom: 20
}).addTo(map);

const listaEl = document.getElementById('lista');
const loadingEl = document.getElementById('loading');
const camadas = {}; // id -> {layer, center}

function linkGoogle(lat, lng){ return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`; }
function linkWaze(lat, lng){ return `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`; }
function linkApple(lat, lng){ return `https://maps.apple.com/?daddr=${lat},${lng}`; }

function popupHTML(t, lat, lng){
  return `
    <div class="popup-eyebrow">Terreno</div>
    <p class="popup-nome">${t.nome}</p>
    <p class="popup-desc">${t.descricao}</p>
    <p class="popup-coords">${lat.toFixed(6)}, ${lng.toFixed(6)}</p>
    <div class="popup-botoes">
      <a href="${linkGoogle(lat,lng)}" target="_blank" rel="noopener">Google Maps</a>
      <a href="${linkWaze(lat,lng)}" target="_blank" rel="noopener" class="waze">Waze</a>
      <a href="${linkApple(lat,lng)}" target="_blank" rel="noopener" class="apple">Apple Maps</a>
    </div>
  `;
}

function ativarItem(id){
  document.querySelectorAll('#lista li').forEach(li => li.classList.toggle('ativo', li.dataset.id === id));
}

async function carregarTerreno(t){
  const resp = await fetch(t.kml);
  const kmlText = await resp.text();
  const kmlDom = new DOMParser().parseFromString(kmlText, 'text/xml');
  const geojson = toGeoJSON.kml(kmlDom);

  const layer = L.geoJSON(geojson, {
    style: { color: '#C9A84C', weight: 2, fillColor: '#7FA65C', fillOpacity: 0.28, dashArray: '5,4' }
  }).addTo(map);

  const center = layer.getBounds().getCenter();
  layer.bindPopup(popupHTML(t, center.lat, center.lng));
  layer.on('click', () => ativarItem(t.id));

  camadas[t.id] = { layer, center, bounds: layer.getBounds() };
  return { layer, center };
}

async function iniciar(){
  const resp = await fetch('terrenos.json');
  const terrenos = await resp.json();

  const allBounds = [];

  for (const t of terrenos) {
    try {
      const { bounds } = await carregarTerreno(t);
      allBounds.push(camadas[t.id].bounds);

      const li = document.createElement('li');
      li.dataset.id = t.id;
      li.tabIndex = 0;
      li.innerHTML = `
        <div class="nome">${t.nome}</div>
        <div class="desc">${t.descricao}</div>
        <div class="coords">${camadas[t.id].center.lat.toFixed(5)}, ${camadas[t.id].center.lng.toFixed(5)}</div>
      `;
      li.addEventListener('click', () => {
        map.flyToBounds(camadas[t.id].bounds, {padding:[60,60], maxZoom:17});
        camadas[t.id].layer.openPopup();
        ativarItem(t.id);
      });
      listaEl.appendChild(li);
    } catch (e) {
      console.error('Erro ao carregar', t.kml, e);
    }
  }

  if (allBounds.length) {
    const grupo = L.featureGroup(Object.values(camadas).map(c => c.layer));
    map.fitBounds(grupo.getBounds(), {padding:[40,40]});
  }

  loadingEl.remove();
}

iniciar();
</script>
</body>
</html>
